worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Flutter Web cache policy ----
    # Flutter의 기본 web 빌드는 entry 파일(main.dart.js, flutter_bootstrap.js 등)에
    # 파일명 hash를 붙이지 않는다. 즉 이 파일들은 "항상 재검증"해야 새 빌드가 뜬다.
    # 반대로 canvaskit/ assets/ icons/ 아래는 빌드가 관리하는 fingerprinted 리소스라
    # 장기 캐시가 안전하다.

    # (1) 해시 없는 entry/shell 파일 — 매번 revalidate
    location = /index.html           { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /main.dart.js         { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter.js           { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /flutter_service_worker.js {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /version.json         { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.json        { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

    # (2) content-addressed 자원 — 장기 immutable
    location ^~ /canvaskit/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ^~ /icons/     { expires 30d; add_header Cache-Control "public, immutable"; }

    # (2b) assets — immutable 캐시. 폰트는 deploy.sh가 파일명에 해시를 붙여 캐시 버스팅.
    # FontManifest.json은 빌드마다 내용이 바뀌므로(해시 폰트 파일명 포함) 항상 재검증.
    location = /assets/FontManifest.json { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location ^~ /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    # (3) SPA fallback — unknown paths hit Flutter router via index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
