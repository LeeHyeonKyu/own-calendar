services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: own-calendar
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./tailscale-serve.json:/config/serve.json:ro
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--hostname=own-calendar

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: own_calendar
    volumes:
      - ${OWN_CALENDAR_DATA:-${HOME}/own-calendar-data}/pgdata:/var/lib/postgresql/data
    # Bind to 127.0.0.1 only so Postgres is not reachable over the tailnet
    # (other tailnet devices must never see 5432). The api container shares
    # the same network namespace via `network_mode: service:tailscale` and
    # still reaches it on 127.0.0.1:5432.
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: service:tailscale
    depends_on:
      - tailscale

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/own_calendar?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: "1"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: >
      sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    network_mode: service:tailscale
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ts-state:
